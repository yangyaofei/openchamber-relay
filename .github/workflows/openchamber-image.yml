name: openchamber-image

# Track upstream @openchamber/web releases on npm and build one runtime image
# per version. Fully decoupled from this repo's git tags: the set of built
# versions is derived by diffing npm versions against the image tags already
# present in GHCR. A rolling window (default 20 most recent versions) is
# backfilled each run; failures on non-latest versions are tolerated so old
# npm releases that no longer install cleanly are skipped, while the latest
# version must always build.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '@openchamber/web version (e.g. 1.2.3, or "latest")'
        required: false
        default: 'latest'
      window:
        description: 'How many recent npm versions to backfill'
        required: false
        default: '20'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/openchamber

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.diff.outputs.versions }}
      latest: ${{ steps.diff.outputs.latest }}
    steps:
      - name: Diff npm versions against GHCR tags
        id: diff
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_WINDOW: ${{ inputs.window }}
        run: |
          set -euo pipefail

          # All published npm versions, oldest first.
          mapfile -t npm_versions \
            < <(npm view @openchamber/web versions --json | jq -r '.[]')

          latest="${npm_versions[-1]}"

          # Optional manual override: build exactly one version.
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "latest" ]; then
            echo "versions=[\"$INPUT_VERSION\"]" >> "$GITHUB_OUTPUT"
            echo "latest=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Existing image tags in GHCR (package is public; anonymous token works).
          existing="$(curl -sf "https://ghcr.io/token?scope=repository:${IMAGE#ghcr.io/}:pull&service=ghcr.io" \
            | jq -r '.token' \
            | xargs -I{} curl -sf -H 'Accept: application/vnd.oci.image.index.v1+json' \
                -H 'Authorization: Bearer {}' \
                "https://ghcr.io/v2/${IMAGE#ghcr.io/}/tags/list?n=1000" \
            | jq -r '.tags[] | ltrimstr("v")' || true)"

          window="${INPUT_WINDOW:-20}"
          # Newest-first slice of the window.
          mapfile -t candidates \
            < <(printf '%s\n' "${npm_versions[@]}" | tac | head -n "$window")

          missing=()
          for v in "${candidates[@]}"; do
            if ! grep -qx "$v" <<< "$existing"; then
              missing+=("$v")
            fi
          done

          # The latest version must always build, even if already tagged
          # would be a no-op, so just include it when missing; if present,
          # nothing to do for it.
          echo "npm latest: $latest"
          echo "existing tags: ${existing//$'\n'/ }"
          echo "missing in window: ${missing[*]:-none}"

          json="$(printf '%s\n' "${missing[@]:-}" | jq -R . | jq -s -c 'map(select(length > 0))')"
          echo "versions=$json" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.versions != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        version: ${{ fromJSON(needs.resolve.outputs.versions) }}
    runs-on: ubuntu-latest
    name: build ${{ matrix.version }}
    # Old npm versions may no longer install cleanly; only the latest is mandatory.
    continue-on-error: ${{ matrix.version != needs.resolve.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ matrix.version }}
          LATEST: ${{ needs.resolve.outputs.latest }}
        run: |
          tags="${IMAGE}:v${VERSION}"
          if [ "$VERSION" = "$LATEST" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/openchamber.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            OPENCHAMBER_VERSION=${{ matrix.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: relay-image

# Relay build & release pipeline.
#
# push to master (relay changes) -> multi-arch image tagged sha-<short> (no version tag)
# tag v*                      -> multi-arch image vX.Y.Z + :latest
#                               + GitHub Release with cross-compiled binaries

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'relay/**'
      - 'docker/relay.Dockerfile'
      - '.github/workflows/relay-image.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/relay

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum

      - name: Vet
        run: go vet ./...
        working-directory: relay

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            echo "tags=${IMAGE}:v${version},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: relay
          file: docker/relay.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-binaries:
    # Attach cross-compiled relay binaries to a GitHub Release (tag builds only).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: linux,  goarch: arm }
          - { goos: linux,  goarch: "386" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum

      - name: Build
        working-directory: relay
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          name="openchamber-relay_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          go build -trimpath -ldflags="-s -w" -o "dist/${name}/openchamber-relay" .
          tar -C "dist/${name}" -czf "dist/${name}.tar.gz" openchamber-relay

      - uses: actions/upload-artifact@v4
        with:
          name: relay-bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: relay/dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: relay-bin-*
          merge-mkdirs: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt

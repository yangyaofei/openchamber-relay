name: relay-image

# Relay build & release pipeline.
#
# push to master (relay changes) -> multi-arch image tagged sha-<short> (no version tag)
# tag v*                       -> multi-arch image vX.Y.Z + :latest
#                                + GoReleaser GitHub Release:
#                                  tar.gz binaries (linux/darwin x amd64/arm64/arm/386,
#                                  each shipping both systemd units),
#                                  deb + rpm packages (system & user units included)

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'relay/**'
      - 'packaging/**'
      - 'docker/relay.Dockerfile'
      - '.goreleaser.yml'
      - '.github/workflows/relay-image.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/relay

jobs:
  build-image:
    # Docker image for every push; version tags on release tags only.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum

      - name: Vet
        run: go vet ./...
        working-directory: relay

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: relay
          file: docker/relay.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # GoReleaser: binaries + deb/rpm + docker image vX.Y.Z & latest.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum

      - name: Vet
        run: go vet ./...
        working-directory: relay

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: 2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push versioned image
        # goreleaser only handles single-arch docker; use buildx for multi-arch.
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          docker buildx build \
            --file docker/relay.Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:v${version}" \
            --tag "${IMAGE}:latest" \
            --push \
            relay
